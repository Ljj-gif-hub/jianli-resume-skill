<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>简历</title>
<style>
  /* 极简模板（minimal）：黑白灰、无彩色、细线分隔，适合外企 / 学术 / 简约风偏好。
     与经典模板同契约：body 820x1160 (min-height)，@page 615.1pt x 870pt，tier 密度档，底部 fit 脚本。 */
  @page { size: 615.1pt 870pt; margin: 0; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  :root { --ink: #111111; --body: #3A3A3A; --muted: #777777; --line: #D8D8D8; }
  body {
    width: 820px; min-height: 1160px; margin: 0 auto;
    font-family: "Microsoft YaHei", "微软雅黑", sans-serif;
    font-size: 14px; line-height: 1.5; color: var(--body); background: #FFF;
  }
  body.tier-compact { font-size: 13px; line-height: 1.42; }
  body.tier-dense   { font-size: 12px; line-height: 1.34; }

  .header { padding: 50px 44px 16px; border-bottom: 2px solid var(--ink); margin: 0 0 6px; }
  .name { font-size: 29px; font-weight: 700; color: var(--ink); letter-spacing: 5px; font-family: Georgia, "宋体", SimSun, serif; }
  .role { font-size: 13.5px; color: var(--muted); margin-top: 6px; letter-spacing: 2px; }
  .contact { font-size: 12.5px; margin-top: 10px; color: var(--muted); }
  .contact span { margin-right: 16px; }

  .section { margin: 0 44px 12px; }
  .sec-title { margin: 14px 0 6px; display: flex; align-items: baseline; }
  .sec-title span { font-size: 16.5px; font-weight: 700; color: var(--ink); letter-spacing: 3px; font-family: Georgia, "宋体", SimSun, serif; }
  .sec-title em { font-style: normal; font-size: 11px; color: var(--muted); margin-left: 10px; letter-spacing: 1px; }
  .divider { border-top: 1px solid var(--line); margin-bottom: 8px; }

  .srow { display: flex; align-items: baseline; margin-bottom: 6px; page-break-inside: avoid; }
  .slab { flex: 0 0 112px; font-weight: 700; color: var(--ink); }
  .scont { flex: 1; line-height: 1.48; }

  .proj-head { display: flex; justify-content: space-between; align-items: baseline; font-size: 14.5px; font-weight: 700; color: var(--ink); margin: 4px 0 5px; }
  .proj-head .pdate { font-size: 12.5px; font-weight: 400; color: var(--muted); white-space: nowrap; }
  .tech { font-size: 12px; color: var(--muted); margin-bottom: 5px; }
  .intro { margin-bottom: 6px; }
  .prow { display: flex; align-items: baseline; margin-bottom: 6px; page-break-inside: avoid; }
  .plab { flex: 0 0 112px; font-weight: 700; color: var(--ink); }
  .pcont { flex: 1; line-height: 1.45; }
</style>
</head>
<body>

  <div class="header">
    <div class="name">【姓名】</div>
    <div class="role">【意向岗位】</div>
    <div class="contact">
      <span>【电话】</span><span>【邮箱】</span><span>【年龄】岁</span><span>【城市】</span><span>【学历】</span>
    </div>
  </div>

  <div class="section">
    <div class="sec-title"><span>相关技能</span><em>SKILLS</em></div>
    <div class="divider"></div>
    <div class="srow"><span class="slab">【技能标签】</span><span class="scont">【技能内容】</span></div>
    <div class="srow"><span class="slab">【技能标签】</span><span class="scont">【技能内容】</span></div>
  </div>

  <div class="section">
    <div class="sec-title"><span>项目经历</span><em>EXPERIENCE</em></div>
    <div class="divider"></div>
    <div class="proj-head">
      <span>【项目名】｜【角色】</span>
      <span class="pdate">【起止时间】</span>
    </div>
    <div class="tech">技术栈：【技术栈】</div>
    <p class="intro">【产品一句话定位】</p>
    <div class="prow"><span class="plab">【能力标签】</span><span class="pcont">【亮点内容】</span></div>
    <div class="prow"><span class="plab">【能力标签】</span><span class="pcont">【亮点内容】</span></div>
  </div>

  <div class="section">
    <div class="sec-title"><span>自我评价</span><em>SUMMARY</em></div>
    <div class="divider"></div>
    <div class="prow"><span class="plab">【标签】</span><span class="pcont">【一句话】</span></div>
  </div>

<script>
/* 单页自适应：内容超出设计画布时整体等比缩小，保证恰好一页。
   底部保留 BOTTOM px 留白，内容不贴页底。CSS zoom 会重新布局，缩小后不残留空白第二页。
   复用项目模板时也把这整段注入到 </body> 前。 */
(function () {
  var BOTTOM = 60; /* 内容距页底的留白(px)；想更空/更满改这里即可 */
  function contentEnd(el) {
    var kids = [];
    for (var i = 0; i < el.children.length; i++) {
      var c = el.children[i];
      if (c.tagName === 'SCRIPT' || c.tagName === 'STYLE') { continue; }
      kids.push(c);
    }
    if (kids.length === 0) { return el.scrollHeight; }
    return kids[kids.length - 1].getBoundingClientRect().bottom;
  }
  function fit() {
    var el = document.body;
    var ow = parseFloat(el.getAttribute('data-ow'));
    var oh = parseFloat(el.getAttribute('data-oh'));
    if (!(ow > 0)) { ow = el.getBoundingClientRect().width || 820; el.setAttribute('data-ow', ow); }
    if (!(oh > 0)) {
      var mh = parseFloat(getComputedStyle(el).minHeight) || 0;
      oh = mh > 0 ? mh : (parseFloat(getComputedStyle(el).height) || 1160);
      el.setAttribute('data-oh', oh);
    }
    el.style.zoom = '1';
    el.style.width = ow + 'px';
    var ch = contentEnd(el);
    var s = Math.min(1, (oh - BOTTOM) / ch, ow / el.scrollWidth);
    if (!(s > 0.5)) { s = 0.5; }
    el.style.width = Math.round(ow / s) + 'px';
    el.style.zoom = s;
  }
  if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', fit); }
  else { fit(); }
  window.addEventListener('load', fit);
})();
</script>
</body>
</html>
